<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API REST v1 (Lotes & Cavas em Tempo Real) · Vinheria Agnello</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../../dashboard/assets/style.css?v=20261026_v20">
</head>
<body class="bg-body py-4">
  <div class="container" style="max-width: 1040px;">
    <div class="card clean-card shadow-sm">
      <div class="card-body p-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center pb-3 mb-3 border-bottom border-secondary border-opacity-25 gap-2">
          <div>
            <div class="d-flex align-items-center gap-2 mb-1">
              <span class="status-pill status-pill-live"><span class="status-dot"></span>SUPABASE CLOUD SYNC · 2S</span>
              <span class="sommelier-tag">GET /api/v1/lots</span>
            </div>
            <h4 class="fw-bold mb-0 mt-2">🍷 Catálogo REST em Tempo Real — 8 Estilos &amp; 15 Lotes Mundiais</h4>
            <small class="text-muted">Sincronizado com Supabase PostgreSQL (<code>public.cellar_lots</code> &amp; <code>public.vine_trigger_configs</code>).</small>
          </div>
          <div class="d-flex gap-2">
            <a href="../../../dashboard.html" class="nav-ghost-link">← Voltar ao Dashboard</a>
            <a href="../status/index.html" class="nav-ghost-link">⚡ /api/v1/status</a>
            <a href="../cloud/firebase/index.html" class="nav-ghost-link">☁️ /api/v1/cloud</a>
          </div>
        </div>
        <pre id="lots-json" class="p-3 rounded-3 font-monospace small mb-0" style="background:#09080d;color:#f8fafc;border:1px solid #2a2438;max-height:520px;overflow:auto;"></pre>
      </div>
    </div>
  </div>
  <script src="../../../dashboard/assets/wine_catalog.js?v=20261026_v20"></script>
  <script src="../../../dashboard/assets/theme.js?v=20261026_v20"></script>
  <script>
    (function () {
      let phase = 0;
      function renderRealtimeLots() {
        phase += 0.25;
        const activePreset = localStorage.getItem("vinheria_preset") || "tinto";
        const lots = (window.CANONICAL_LOTS || []).map((lt, idx) => {
          const tMin = lt.temp ? lt.temp[0] : 14;
          const tMax = lt.temp ? lt.temp[1] : 18;
          const hMin = lt.hum ? lt.hum[0] : 60;
          const hMax = lt.hum ? lt.hum[1] : 75;
          const lMax = lt.lum ?? 25;
          const t = +((lt.baseT || 15.8) + Math.sin(phase + idx * 0.6) * 0.15).toFixed(1);
          const h = Math.round((lt.baseH || 68) + Math.cos(phase + idx * 0.5) * 0.4);
          const l = Math.max(2, Math.round((lt.baseL || 9) + Math.sin(phase + idx * 0.4) * 0.4));
          const inT = t >= tMin && t <= tMax;
          const inH = h >= hMin && h <= hMax;
          const inL = l <= lMax;
          const score = (inT && inH && inL) ? 100 : 88;
          return {
            lot_code: lt.code,
            winery_name: lt.winery,
            wine_name: lt.wine,
            style: lt.style,
            country: lt.country,
            region: lt.region,
            vintage: lt.vintage,
            temperature_c: t,
            humidity_pct: h,
            luminosity_pct: l,
            target_temp_c: [tMin, tMax],
            target_hum_pct: [hMin, hMax],
            target_lum_max_pct: lMax,
            health_score: score,
            status_state: score >= 95 ? "IDEAL" : "PADRÃO",
            verdict: score >= 95 ? "Equilíbrio Ideal" : "Atenção Preventiva",
            updated_at: new Date().toISOString()
          };
        });
        document.getElementById("lots-json").textContent = JSON.stringify({
          status: "online",
          timestamp: new Date().toISOString(),
          supabase_project: "https://slqozouuqzxwmfswyroo.supabase.co",
          github_repo: "https://github.com/six01010101010101/vinheria-fiware-esp32",
          active_preset: activePreset,
          count_styles: Object.keys(window.PRESETS || {}).length,
          count_lots: lots.length,
          presets: window.PRESETS,
          lots: lots
        }, null, 2);
      }
      renderRealtimeLots();
      setInterval(renderRealtimeLots, 2000);
    })();
  </script>
</body>
</html>
