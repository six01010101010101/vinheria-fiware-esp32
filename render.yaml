services:
  - type: web
    name: checkpoint5-vinheria-fiware-esp32-1
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --chdir dashboard app:server --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
